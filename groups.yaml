# Local routing
proxy-groups:
- name: PROXY
  type: select
  proxies:
  - 自动选择
  - 故障转移
  - DIRECT
  - REJECT
  include-all: true
  empty-fallback: REJECT
- name: 自动选择
  type: url-test
  include-all: true
  empty-fallback: REJECT
  exclude-filter: '(?i)(剩余[流量天数]*|套餐|流量[：: ]|重置|到期|过期|有效期|官网|官網|订阅|訂閱|公告|客服|网址|網址|续费|續費|traffic|expire|expiration|reset|remaining|quota|bandwidth|[0-9]+(?:\.[0-9]+)?\s*(?:GB|TB)\s*(?:/|剩余|remaining))'
  exclude-type: Direct|Reject|RejectDrop|Compatible|Pass
  url: https://www.gstatic.com/generate_204
  interval: 300
  timeout: 5000
  lazy: true
  expected-status: 204
  tolerance: 80
- name: 故障转移
  type: fallback
  include-all: true
  empty-fallback: REJECT
  exclude-filter: '(?i)(剩余[流量天数]*|套餐|流量[：: ]|重置|到期|过期|有效期|官网|官網|订阅|訂閱|公告|客服|网址|網址|续费|續費|traffic|expire|expiration|reset|remaining|quota|bandwidth|[0-9]+(?:\.[0-9]+)?\s*(?:GB|TB)\s*(?:/|剩余|remaining))'
  exclude-type: Direct|Reject|RejectDrop|Compatible|Pass
  url: https://www.gstatic.com/generate_204
  interval: 300
  timeout: 5000
  lazy: true
  expected-status: 204
- name: AI服务
  type: select
  proxies:
  - PROXY
  - 自动选择
  - 故障转移
  - DIRECT
  - REJECT
  include-all: true
  empty-fallback: REJECT
  exclude-filter: '(?i)(剩余[流量天数]*|套餐|流量[：: ]|重置|到期|过期|有效期|官网|官網|订阅|訂閱|公告|客服|网址|網址|续费|續費|traffic|expire|expiration|reset|remaining|quota|bandwidth|[0-9]+(?:\.[0-9]+)?\s*(?:GB|TB)\s*(?:/|剩余|remaining))'
- name: 社媒服务
  type: select
  proxies:
  - PROXY
  - 自动选择
  - 故障转移
  - DIRECT
  - REJECT
  include-all: true
  empty-fallback: REJECT
  exclude-filter: '(?i)(剩余[流量天数]*|套餐|流量[：: ]|重置|到期|过期|有效期|官网|官網|订阅|訂閱|公告|客服|网址|網址|续费|續費|traffic|expire|expiration|reset|remaining|quota|bandwidth|[0-9]+(?:\.[0-9]+)?\s*(?:GB|TB)\s*(?:/|剩余|remaining))'
- name: 银行服务
  type: select
  proxies:
  - DIRECT
  - PROXY
  - 自动选择
  - 故障转移
  - REJECT
  include-all: true
  empty-fallback: REJECT
  exclude-filter: '(?i)(剩余[流量天数]*|套餐|流量[：: ]|重置|到期|过期|有效期|官网|官網|订阅|訂閱|公告|客服|网址|網址|续费|續費|traffic|expire|expiration|reset|remaining|quota|bandwidth|[0-9]+(?:\.[0-9]+)?\s*(?:GB|TB)\s*(?:/|剩余|remaining))'
