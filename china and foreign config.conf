DOMAIN-SUFFIX,chengdu.gov.cn,DIRECT
DOMAIN-SUFFIX,cq.gov.cn,DIRECT
DOMAIN-SUFFIX,zjzwfw.gov.cn,DIRECT
DOMAIN-SUFFIX,hangzhou.gov.cn,DIRECT

# L1 核心交易资产 (强绑远端解析，严防 DNS 污染)
DOMAIN-SUFFIX,polymarket.com,PROXY,force-remote-dns
DOMAIN-SUFFIX,binance.com,PROXY,force-remote-dns
DOMAIN-SUFFIX,okx.com,PROXY,force-remote-dns
