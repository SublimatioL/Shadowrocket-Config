# Shadowrocket

[General]
compatibility-mode = 3

ipv6 = false
prefer-ipv6 = false
private-ip-answer = true

# Proxy DNS
dns-server = https://1.1.1.1/dns-query#proxy
fallback-dns-server = https://8.8.8.8/dns-query#proxy

# Direct DNS
direct-dns-server = https://dns.alidns.com/dns-query,https://doh.pub/dns-query

# Node DNS
proxy-dns-server = https://dns.alidns.com/dns-query,https://doh.pub/dns-query
dns-direct-system = false
dns-direct-fallback-proxy = false
always-ip-address = true
use-local-host-item-for-proxy = false
allow-dns-svcb = false
allow-dns-all = true

hijack-dns = 8.8.8.8:53,8.8.4.4:53,1.1.1.1:53,1.0.0.1:53,9.9.9.9:53,223.5.5.5:53,223.6.6.6:53,119.29.29.29:53,114.114.114.114:53

udp-policy-not-supported-behaviour = REJECT
close-if-proxy-chain-missing = true
block-quic = always-allow

[Rule]
# DNS / IPv6 guard
DST-PORT,53,REJECT
DST-PORT,853,REJECT
IP-CIDR6,::/0,REJECT,no-resolve

# LAN
DOMAIN,localhost,DIRECT
DOMAIN-SUFFIX,local,DIRECT
DOMAIN-SUFFIX,lan,DIRECT
DOMAIN-SUFFIX,home.arpa,DIRECT
IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
IP-CIDR,169.254.0.0/16,DIRECT,no-resolve
IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
IP-CIDR,224.0.0.0/4,DIRECT,no-resolve
IP-CIDR,255.255.255.255/32,DIRECT,no-resolve

# DNS routes
DOMAIN,dns.alidns.com,DIRECT
DOMAIN,doh.pub,DIRECT
IP-CIDR,223.5.5.5/32,DIRECT,no-resolve
IP-CIDR,223.6.6.6/32,DIRECT,no-resolve
IP-CIDR,1.12.12.12/32,DIRECT,no-resolve
IP-CIDR,120.53.53.53/32,DIRECT,no-resolve
IP-CIDR,1.1.1.1/32,PROXY,no-resolve
IP-CIDR,8.8.8.8/32,PROXY,no-resolve

