name: Refresh rules

on:
  schedule:
    - cron: '45 22 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-rules
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Refresh and check
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/update_rules.py
      - name: Save rules
        run: |
          if git diff --quiet -- rules/direct.list; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rules/direct.list rules/LICENSE
          git commit -m 'Refresh domestic rules'
          git push
