# 3. 闸门
# 任何未命中上述白名单的域名，绝不进行本地解析，直接走代理
FINAL,PROXY

[Host]
localhost = 127.0.0.1
dns.alidns.com = 223.5.5.5
doh.pub = 1.12.12.12

[Host]
localhost = 127.0.0.1
