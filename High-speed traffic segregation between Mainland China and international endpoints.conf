[General]

# 开启双栈放行，优先 IPv4。恢复系统物理网卡自治，消除发热与异常电量消耗。
ipv6 = true
prefer-ipv6 = false
bypass-system = true

# 保留底层局域网段与广播探测隔离，防止本地环回死锁
tun-excluded-routes = 224.0.0.0/4, 255.255.255.255/32, ::1/128, fc00::/7, fe80::/10, ff00::/8
skip-proxy = 127.0.0.0/8, localhost, *.local, *.lan, *.internal, captive.apple.com, *.ls.apple.com, swscan.apple.com, mesu.apple.com

# 主解析：极速双栈 DoH
dns-server = https://223.5.5.5/dns-query, https://1.12.12.12/dns-query

# 备解析
fallback-dns-server = https://149.112.112.112/dns-query, https://94.140.14.140/dns-query

# 解析防漏逻辑
dns-direct-system = false
dns-direct-fallback-proxy = true
private-ip-answer = true

hijack-dns = 8.8.8.8:53, 8.8.4.4:53, 1.1.1.1:53, 1.0.0.1:53, 149.112.112.112:53, 94.140.14.140:53, 223.5.5.5:53, 119.29.29.29:53

[Rule]

IP-CIDR,149.112.112.112/32,PROXY,no-resolve
IP-CIDR,94.140.14.140/32,PROXY,no-resolve
IP-CIDR,1.1.1.1/32,PROXY,no-resolve
IP-CIDR,8.8.8.8/32,PROXY,no-resolve


IP-CIDR,239.255.255.250/32,REJECT,no-resolve
IP-CIDR,224.0.0.0/4,REJECT,no-resolve
IP-CIDR,100.64.0.0/10,REJECT,no-resolve
DOMAIN-SUFFIX,local,REJECT

IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
IP-CIDR,127.0.0.0/8,DIRECT,no-resolve

# Apple 核心生态
DOMAIN-SUFFIX,push.apple.com,DIRECT
DOMAIN-SUFFIX,ess.apple.com,DIRECT
DOMAIN-SUFFIX,aaplimg.com,DIRECT
DOMAIN-SUFFIX,ls.apple.com,DIRECT
DOMAIN-KEYWORD,captive.apple.com,DIRECT,no-resolve

# 身份验证防风控
DOMAIN-SUFFIX,geetest.com,DIRECT
DOMAIN-SUFFIX,dingxiang-inc.com,DIRECT
DOMAIN-SUFFIX,tongdun.cn,DIRECT
DOMAIN-SUFFIX,shumei.com,DIRECT
DOMAIN-SUFFIX,faceplusplus.com,DIRECT
DOMAIN-SUFFIX,megvii.com,DIRECT
DOMAIN-SUFFIX,sensetime.com,DIRECT

# 核心金融机构
DOMAIN-SUFFIX,unionpay.com,DIRECT
DOMAIN-SUFFIX,95516.com,DIRECT
DOMAIN-SUFFIX,alipay.com,DIRECT
DOMAIN-SUFFIX,chinaums.com,DIRECT
DOMAIN-SUFFIX,gov.cn,DIRECT

IP-CIDR,119.29.0.0/16,DIRECT,no-resolve
IP-CIDR,106.11.0.0/16,DIRECT,no-resolve
IP-CIDR,110.249.0.0/16,DIRECT,no-resolve
IP-CIDR,14.215.0.0/16,DIRECT,no-resolve
IP-CIDR,101.231.0.0/16,DIRECT,no-resolve


RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/China/China.list,DIRECT

# 拦截所有漏网的国内新段 IPv6 地址，确保境内真实 IP 不发生跨国漂移
GEOIP,CN,DIRECT

FINAL,PROXY

[Host]
localhost = 127.0.0.1
