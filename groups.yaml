# Local additions
proxy-groups+:
- name: AI 服务
  type: select
  proxies:
  - 美国节点
  - 日本节点
  - 新加坡节点
  - 英国节点
  - 德国节点
  - 法国节点
  - 加拿大节点
  - 澳大利亚节点
  - 韩国节点
  - 台湾节点
  - 香港节点
  - 印度节点
  - 智利节点
  - 巴西节点
  - 西班牙节点
  - 瑞士节点
  - 瑞典节点
  - 墨西哥节点
  - 阿联酋节点
  - 南非节点
  - 沙特阿拉伯节点
  - 哥伦比亚节点
  - 以色列节点
  - 越南节点
  - 泰国节点
  - 马来西亚节点
  - 俄罗斯节点
  - 菲律宾节点
  - 尼日利亚节点
  - 印度尼西亚节点
  - 土耳其节点
  - 希腊节点
  - 缅甸节点
  - 巴基斯坦节点
  - 挪威节点
  - 柬埔寨节点
  - 埃及节点
  - 伊拉克节点
  - 孟加拉国节点
  - 哈萨克斯坦节点
  - 阿根廷节点
  empty-fallback: REJECT
- name: 香港节点
  type: select
  include-all: true
  filter: (?i)香港|Hong[ -]?Kong|\bHK\b|🇭🇰
  empty-fallback: REJECT
- name: 新加坡节点
  type: select
  include-all: true
  filter: (?i)新加坡|Singapore|\bSG\b|🇸🇬
  empty-fallback: REJECT
- name: 日本节点
  type: select
  include-all: true
  filter: (?i)日本|Japan|\bJP\b|🇯🇵
  empty-fallback: REJECT
- name: 台湾节点
