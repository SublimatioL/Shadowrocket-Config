DOMAIN-SUFFIX,whatsapp.net,PROXY,force-remote-dns
DOMAIN-SUFFIX,openai.com,PROXY,force-remote-dns
DOMAIN-SUFFIX,chatgpt.com,PROXY,force-remote-dns
DOMAIN-SUFFIX,anthropic.com,PROXY,force-remote-dns
DOMAIN-SUFFIX,claude.ai,PROXY,force-remote-dns
DOMAIN-SUFFIX,perplexity.ai,PROXY,force-remote-dns
DOMAIN-SUFFIX,github.com,PROXY,force-remote-dns

# 去广告引擎与黑名单

# 番茄小说定向去广告
DOMAIN-SUFFIX,pangolin-sdk-toutiao.com,REJECT
DOMAIN-SUFFIX,pangolin-sdk-toutiao-b.com,REJECT
DOMAIN-SUFFIX,pglstatp-toutiao.com,REJECT
DOMAIN-SUFFIX,frontier-toutiao.snssdk.com,REJECT
DOMAIN-SUFFIX,ads5-normal-lf.zijieapi.com,REJECT

# 动态去广告引擎 (CDN 镜像源加速替换)
RULE-SET,https://fastly.jsdelivr.net/gh/privacy-protection-tools/anti-AD@master/anti-ad-shadowrocket.txt,REJECT

# 常规与兜底规则

# 海外业务强制远端解析双保险 (CDN 镜像源加速替换)
RULE-SET,https://fastly.jsdelivr.net/gh/Loyalsoldier/v2ray-rules-dat@release/proxy.txt,PROXY,force-remote-dns
RULE-SET,https://fastly.jsdelivr.net/gh/Loyalsoldier/v2ray-rules-dat@release/telegramcidr.txt,PROXY,no-resolve

# 国内基础业务直连兜底 (CDN 镜像源加速替换)
RULE-SET,https://fastly.jsdelivr.net/gh/Loyalsoldier/v2ray-rules-dat@release/direct.txt,DIRECT
GEOIP,CN,DIRECT

# 流量逃逸最终兜底前的 IPv6 物理斩断
IP-CIDR6,::/0,REJECT,no-resolve

# 流量逃逸最终兜底 (Fail-Closed：未知流量全部送入加密隧道)
FINAL,PROXY,force-remote-dns


[Host]
localhost           = 127.0.0.1

